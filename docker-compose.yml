services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvoptimizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvoptimizer}
      POSTGRES_DB: ${POSTGRES_DB:-cv_optimizer}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cv_optimizer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvoptimizer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cv_optimizer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:migrate"]
    environment:
      PORT: 4000
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cvoptimizer}:${POSTGRES_PASSWORD:-cvoptimizer}@db:5432/${POSTGRES_DB:-cv_optimizer}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required; set a unique value of at least 32 characters in .env}
      AI_JOB_ENCRYPTION_KEY: ${AI_JOB_ENCRYPTION_KEY:?AI_JOB_ENCRYPTION_KEY is required; set a random base64-encoded 32-byte key in .env}
      AI_MONTHLY_QUOTA: ${AI_MONTHLY_QUOTA:-10}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-4}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required — set it in your .env file}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      UPLOAD_TMP_DIR: tmp_uploads
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cvoptimizer}:${POSTGRES_PASSWORD:-cvoptimizer}@db:5432/${POSTGRES_DB:-cv_optimizer}?schema=public
      REDIS_URL: redis://redis:6379
      AI_JOB_ENCRYPTION_KEY: ${AI_JOB_ENCRYPTION_KEY:?AI_JOB_ENCRYPTION_KEY is required; set a random base64-encoded 32-byte key in .env}
      AI_MONTHLY_QUOTA: ${AI_MONTHLY_QUOTA:-10}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-4}
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required — set it in your .env file}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  cv_optimizer_db_data:
  cv_optimizer_redis_data:
